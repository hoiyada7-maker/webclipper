name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install

      - name: typecheck
        run: bunx tsc --noEmit

  rust-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-check-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-check-
            windows-cargo-

      - name: placeholder resources dir
        # tauri.conf.json declares bundle.resources: ["resources/"], so the
        # tauri-build script requires this directory to exist even for
        # `cargo check`. The real JAR/JRE are only fetched for actual builds
        # (see scripts/fetch-runtime.ps1); an empty dir is enough here.
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --release
