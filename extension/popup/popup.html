<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Web Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <span>Web Clipper</span>
  </header>

  <div class="options">
    <label>
      출력 모드
      <select id="mode">
        <option value="base64">Base64 임베드 (단일 .md)</option>
        <option value="link">이미지 링크 (assets 폴더)</option>
      </select>
    </label>

    <label class="row">
      <input type="checkbox" id="auto-scroll">
      <span>자동 스크롤 (무한스크롤 페이지)</span>
    </label>

    <label class="row">
      <input type="checkbox" id="clean-content" checked>
      <span>주요 콘텐츠만 추출</span>
    </label>

    <label class="row">
      <input type="checkbox" id="spa-mode">
      <span>SPA 대기 (JS 렌더링 페이지)</span>
    </label>
  </div>

  <button id="clip-btn">📎 클립 시작</button>

  <div id="log"></div>

  <div class="shortcut-hint">
    단축키: <strong id="shortcut-display">Ctrl+Shift+U</strong>
    <a href="#" id="shortcut-change">변경</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
